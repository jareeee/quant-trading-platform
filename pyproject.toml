[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-trading-platform"
version = "0.1.0"
description = "Local-first multi-asset automated quant trading platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "ccxt>=4.4,<5",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
trading-core = "quant_platform.cli.core:app"
trading-cli = "quant_platform.cli.client:app"
trading-api = "quant_platform.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quant_platform"]
